[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "install-doctor"
version = "0.1.0"
description = "Evidence-driven Python dependency maintenance workbench"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "packaging>=24", "pydantic>=2.10,<3"]

[tool.setuptools]
packages = ["install_doctor"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
install-doctor = "install_doctor.cli:main"

[tool.setuptools.package-data]
install_doctor = ["probe.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
